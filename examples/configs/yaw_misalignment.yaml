# Static yaw misalignment analysis on the La Haute Borne example data, mirroring the
# non-UQ case in examples/07_static_yaw_misalignment.ipynb.
#
#   python -m openoa.cli run yaw_misalignment \
#     --config examples/configs/yaw_misalignment.yaml --output-dir /tmp/openoa_yaw_misalignment
seed: 42
plant:
  loader: examples.project_ENGIE:prepare
  loader_kwargs:
    path: ../data/la_haute_borne  # relative to this file
  analysis_type: StaticYawMisalignment
analysis:
  turbine_ids: null  # all turbines
  UQ: false
  num_sim: 1
  ws_bins: [4.0, 5.0, 6.0, 7.0, 8.0, 9.0, 10.0]
  ws_bin_width: 1.0
  vane_bin_width: 1.0
  min_vane_bin_count: 50
  max_abs_vane_angle: 25.0
  pitch_thresh: 0.5
  max_power_filter: 0.95
  power_bin_mad_thresh: 7.0
  use_power_coeff: true
